<!doctype html>
<!-- Carta Magica store selector v2 (black & gold, skylines + dragons). Static, no libraries, no cookies, no tracking.
     Original vector art drawn for this page. Rollback: git tag v1-french-first. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#000000">
<title>Carta Magica — Choose your store</title>
<meta name="description" content="Carta Magica — choose your store: Montreal or Ottawa.">
<link rel="icon" href="assets/logo-carta-magica.png">
<style>
:root{--gold:#C09030;--gold-b:#dfaf48;--gold-d:#84601d;--cream:#fff4d2}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--gold-b);min-height:100%}
body{font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.top{position:relative;z-index:2;text-align:center;padding:clamp(18px,3.4vh,34px) 16px clamp(14px,2.6vh,26px)}
.logo{display:block;margin:0 auto clamp(8px,1.6vh,14px);width:auto;height:clamp(46px,7vh,68px)}
h1{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.t-en{font-size:clamp(1.55rem,3.6vw,2.7rem);letter-spacing:.22em;padding-left:.22em;line-height:1.05;
  background:linear-gradient(180deg,var(--cream) 0%,var(--gold-b) 45%,var(--gold) 70%,var(--gold-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px #c0903044)}
.t-fr{font-size:clamp(.9rem,1.7vw,1.15rem);letter-spacing:.12em;padding-left:.12em;font-weight:600;color:var(--gold)}
.rule{width:min(320px,60vw);height:1px;margin:clamp(10px,1.8vh,16px) auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
main{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,28px);padding:0 clamp(14px,3vw,44px) clamp(18px,3.5vh,40px);max-width:1500px;width:100%;margin:0 auto}
.half{position:relative;display:block;min-height:clamp(380px,64vh,760px);border-radius:24px;overflow:hidden;text-decoration:none;color:inherit;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 38%,#2a1f0b 0%,#0d0a05 46%,#000 78%);border:1px solid #c0903066;
  box-shadow:0 0 0 1px #000,0 24px 60px #000c;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.half:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,var(--cream),var(--gold) 30%,transparent 55%,var(--gold-d) 85%,var(--gold-b));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;z-index:3;pointer-events:none;transition:opacity .35s}
.half svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.aura{transform-box:fill-box;transform-origin:center}
.label{position:absolute;left:0;right:0;top:clamp(20px,5%,44px);z-index:2;text-align:center;pointer-events:none}
.city{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(2rem,4.6vw,4rem);letter-spacing:.16em;padding-left:.16em;line-height:1;
  background:linear-gradient(180deg,var(--cream) 0%,var(--gold-b) 50%,var(--gold) 78%,var(--gold-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 22px #dfaf4855)}
.enter{position:absolute;left:50%;bottom:clamp(14px,3%,26px);transform:translateX(-50%);z-index:2;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
  padding:11px 22px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.2em;color:#000;background:linear-gradient(180deg,var(--gold-b),var(--gold));
  box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-d),0 10px 28px #000;transition:box-shadow .35s}
.enter b{font-size:1rem;letter-spacing:0;transition:transform .35s}
.last{position:absolute;top:14px;right:14px;z-index:4;font-size:.62rem;font-weight:800;letter-spacing:.16em;color:#000;background:var(--cream);border-radius:999px;padding:5px 10px;box-shadow:0 0 0 1px var(--gold-d)}
.last[hidden]{display:none}
.half:hover,.half:focus-visible{transform:translateY(-6px);border-color:var(--gold-b);box-shadow:0 0 0 1px #000,0 0 0 2px #dfaf4888,0 0 60px #dfaf4844,0 30px 70px #000}
.half:hover:before,.half:focus-visible:before{opacity:1}
.half:hover .enter,.half:focus-visible .enter{box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-b),0 0 26px #dfaf48aa}
.half:hover .enter b,.half:focus-visible .enter b{transform:translateX(4px)}
.half:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.dragon{filter:drop-shadow(0 0 6px #dfaf4870);transition:filter .35s}
.half:hover .dragon,.half:focus-visible .dragon{filter:drop-shadow(0 0 12px #ffd77acc)}
footer{position:relative;z-index:2;text-align:center;font-size:.68rem;letter-spacing:.14em;color:#8a7344;padding:0 16px 18px}
@media (prefers-reduced-motion:no-preference){
  .aura{animation:pulse 6s ease-in-out infinite}
  .half:nth-child(2) .aura{animation-delay:-3s}
  .eye{animation:eye 6s ease-in-out infinite}
}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes eye{0%,100%{opacity:.75}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.half,.half:before,.enter,.enter b{transition:none}.half:hover,.half:focus-visible{transform:none}#embers{display:none}}
@media (max-width:760px){
  main{grid-template-columns:1fr;gap:16px}
  .half{min-height:clamp(300px,52vh,440px)}
  .city{font-size:clamp(2rem,10vw,2.8rem)}
  .t-en{font-size:clamp(1.15rem,6.2vw,1.6rem);letter-spacing:.13em;padding-left:.13em}
}
</style></head>

  </symbol>
</defs></svg>

<header class="top">
  <img class="logo" src="assets/logo-carta-magica.png" alt="Carta Magica" width="500" height="388">
  <h1><span class="t-en">CHOOSE YOUR STORE</span><span class="t-fr" lang="fr">Choisissez votre magasin</span></h1>

<main>

        <g stroke="#C09030" stroke-width="1" fill="none" opacity=".8"><ellipse rx="44" ry="14"/><ellipse rx="44" ry="30"/><ellipse rx="14" ry="44"/><ellipse rx="30" ry="44"/><path d="M-44 0 H44 M0 -44 V44"/></g></g>

    <span class="label"><span class="city">MONTREAL</span></span>
    <span class="last" hidden>LAST VISITED</span>

      <ellipse class="aura" cx="300" cy="340" rx="290" ry="240" fill="url(#auraG)"/>

<footer>CARTA MAGICA · MONTREAL · OTTAWA</footer>

<script>
(function(){
  // remember last store (this device only; no cookies)
  try{var l=localStorage.getItem('cm-store');var el=l&&document.querySelector('#'+l+' .last');if(el)el.hidden=false;}catch(e){}
  document.querySelectorAll('.half').forEach(function(a){a.addEventListener('click',function(){try{localStorage.setItem('cm-store',a.dataset.store)}catch(e){}})});
  // drifting embers (canvas, ~40 particles, paused when hidden, off for reduced motion)
  var mq=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');if(mq&&mq.matches)return;
  var c=document.getElementById('embers'),x=c.getContext('2d'),W,H,D=Math.min(window.devicePixelRatio||1,2),P=[],N;
  function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);N=Math.round(Math.min(60,Math.max(24,W*H/26000)));while(P.length<N)P.push(spawn(true));P.length=N;}
  function spawn(any){return{x:Math.random()*W,y:any?Math.random()*H:H+10,r:Math.random()*1.8+.6,vy:-(Math.random()*.35+.12),vx:(Math.random()-.5)*.18,ph:Math.random()*6.28,s:Math.random()*.02+.006,a:Math.random()*.5+.35}}
  var last=0;function tick(t){var dt=Math.min(50,t-(last||t))/16.7;last=t;x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];p.ph+=p.s*dt;p.x+=(p.vx+Math.sin(p.ph)*.25)*dt;p.y+=p.vy*dt;if(p.y<-10||p.x<-10||p.x>W+10){P[i]=spawn(false);continue}
      var f=p.a*(.6+.4*Math.sin(p.ph*3)),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,'rgba(255,236,170,'+f+')');g.addColorStop(.35,'rgba(223,175,72,'+f*.6+')');g.addColorStop(1,'rgba(192,144,48,0)');
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,6.283);x.fill();}
    raf=requestAnimationFrame(tick)}
  var raf;size();addEventListener('resize',size);raf=requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',function(){if(document.hidden)cancelAnimationFrame(raf);else{last=0;raf=requestAnimationFrame(tick)}});
})();
</script>
</body></html>
