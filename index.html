<!doctype html>
<!-- Carta Magica store selector v3: the official Carta Magica dragon logo, one version per store
     (wordmark replaced with MONTREAL / OTTAWA). Static, no libraries, no cookies, no tracking.
     Rollback: git tags v2-skylines (previous design) and v1-french-first. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#000000">
<title>Carta Magica — Choose your store / Choisissez votre magasin</title>
<meta name="description" content="Carta Magica — choose your store: Montreal or Ottawa.">
<link rel="icon" href="assets/logo-carta-magica.png">
<style>
:root{--gold:#CC9933;--gold-b:#e2b553;--gold-d:#8E6C30;--cream:#fff4d2}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--gold-b);min-height:100%}
body{font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  background:radial-gradient(90% 60% at 50% 45%,#1a1306 0%,#070502 55%,#000 85%)}
header{text-align:center;padding:clamp(22px,5vh,56px) 16px clamp(8px,2vh,20px)}
h1{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800}
.t-en{font-size:clamp(1.5rem,3.6vw,2.6rem);letter-spacing:.22em;padding-left:.22em;line-height:1.05;text-transform:uppercase;
  background:linear-gradient(180deg,var(--cream) 0%,var(--gold-b) 45%,var(--gold) 70%,var(--gold-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-fr{font-size:clamp(.9rem,1.7vw,1.15rem);letter-spacing:.12em;padding-left:.12em;font-weight:600;color:var(--gold)}
.rule{width:min(320px,60vw);height:1px;margin:clamp(12px,2vh,18px) auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(16px,3vw,48px);padding:clamp(8px,2vh,24px) clamp(14px,4vw,64px) clamp(18px,4vh,44px);max-width:1400px;width:100%;margin:0 auto}
.store{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);padding:clamp(16px,3vw,36px);border-radius:24px;text-decoration:none;color:inherit;
  border:1px solid #cc993333;background:radial-gradient(70% 60% at 50% 45%,#2a1f0b88 0%,#0000 70%);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s}
.store img{display:block;width:100%;max-width:560px;height:auto;filter:drop-shadow(0 10px 30px #000);transition:filter .35s,transform .35s}
.enter{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;padding:11px 22px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.2em;color:#000;
  background:linear-gradient(180deg,var(--gold-b),var(--gold));box-shadow:0 0 0 1px #000,0 0 0 2px var(--gold-d),0 10px 28px #000}
.enter b{font-size:1rem;letter-spacing:0;transition:transform .35s}
.store:hover,.store:focus-visible{transform:translateY(-4px);border-color:#cc9933aa;box-shadow:0 0 50px #cc993322;outline:none}
.store:hover img,.store:focus-visible img{filter:drop-shadow(0 0 24px #cc993366) drop-shadow(0 10px 30px #000);transform:scale(1.02)}
.store:hover .enter b,.store:focus-visible .enter b{transform:translateX(4px)}
.store:focus-visible{box-shadow:0 0 0 3px var(--cream)}
.last{position:absolute;top:12px;right:12px;font-size:.62rem;font-weight:800;letter-spacing:.16em;color:#000;background:var(--cream);border-radius:999px;padding:5px 10px;box-shadow:0 0 0 1px var(--gold-d)}
.last[hidden]{display:none}
footer{text-align:center;font-size:.68rem;letter-spacing:.14em;color:#8a7344;padding:0 16px 18px}
@media (max-width:760px){main{grid-template-columns:1fr;gap:18px}.store img{max-width:420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header>
  <h1><span class="t-en">Choose your store</span><span class="t-fr" lang="fr">Choisissez votre magasin</span></h1>
  <div class="rule"></div>
</header>
<main>
  <a class="store" id="montreal" data-store="montreal" href="https://1p9p08-ym.myshopify.com/fr-ca" hreflang="fr-CA" aria-label="Carta Magica Montréal — magasin de Montréal / Montreal store">
    <span class="last" hidden>LAST VISITED</span>
    <img src="assets/logo-carta-magica-montreal.png" width="1000" height="776" alt="Carta Magica dragon holding the word MONTREAL">
    <span class="enter">MONTRÉAL <b>→</b></span>
  </a>
  <a class="store" id="ottawa" data-store="ottawa" href="https://y0mnsf-rp.myshopify.com/" hreflang="en-CA" aria-label="Carta Magica Ottawa — Ottawa store">
    <span class="last" hidden>LAST VISITED</span>
    <img src="assets/logo-carta-magica-ottawa.png" width="1000" height="776" alt="Carta Magica dragon holding the word OTTAWA">
    <span class="enter">OTTAWA <b>→</b></span>
  </a>
</main>
<footer>CARTA MAGICA · MONTRÉAL · OTTAWA</footer>
<script>
(function(){
  try{var l=localStorage.getItem('cm-store');var el=l&&document.querySelector('#'+l+' .last');if(el)el.hidden=false;}catch(e){}
  document.querySelectorAll('.store').forEach(function(a){a.addEventListener('click',function(){try{localStorage.setItem('cm-store',a.dataset.store)}catch(e){}})});
})();
</script>
</body></html>
